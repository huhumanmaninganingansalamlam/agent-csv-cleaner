name: Test and verify Docker API
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run all regression tests
        run: python -m unittest -v test_api test_core
      - name: Build Docker image
        run: docker build -t agent-csv-cleaner .
      - name: Start container and prove API over HTTP
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name csv-api-smoke -p 127.0.0.1:8000:8000 agent-csv-cleaner
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          sh smoke_test.sh | tee docker-http-proof.txt
      - name: Save verified image
        run: docker save agent-csv-cleaner -o agent-csv-cleaner-image.tar
      - name: Upload verified image and HTTP proof
        uses: actions/upload-artifact@v7
        with:
          name: agent-csv-cleaner-image-${{ github.sha }}
          path: |
            agent-csv-cleaner-image.tar
            docker-http-proof.txt
          if-no-files-found: error
          retention-days: 7
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs csv-api-smoke || true
          docker rm -f csv-api-smoke || true
